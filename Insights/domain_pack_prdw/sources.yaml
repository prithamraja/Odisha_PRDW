# =============================================================================
# domain_pack_prdw / sources.yaml
# =============================================================================
# Odisha Panchayati Raj & Drinking Water — "Discover" source registration.
#
# Input is `Data/` exactly as distributed: 19 per-table CSVs, no staging script.
# The runner reads every file with all_varchar=true (no type sampling), so every
# numeric / date column the pack uses must be cast explicitly here; IDs and
# anything not listed stay VARCHAR.
#
# Cast rules follow domain_pack/README.md and DISCOVER_VIEW_MAPPING.md §7:
#   money / continuous measures -> float    counts, years -> int
#   calendar dates              -> date     everything else stays VARCHAR
# Decode-joining codes (focus_area, activity_status, work_type, activity_type,
# activity_for, output_type, scheme_code, scheme_component_code, asset_*,
# training_*, community_service_code) stay VARCHAR: `create_views.sql` joins
# them to dim_code.code, which is VARCHAR, and casting either side would make
# the decode depend on numeric formatting rather than on the code.
#
# SAMPLE SCALE LIVES HERE. `expected_rows` below are the WP-D0 audited sample
# counts (DISCOVER_VIEW_MAPPING §2, re-measured in WP-D1). When the statewide
# drop lands in the same format (D15), this block and validation.yaml `post_view`
# are the only two places that change — no view SQL carries a scale literal.
# =============================================================================

# Tight: these are exact known counts, not estimates. A 1% drift is a real
# change in the drop and should stop the build under --strict.
row_count_tolerance_pct: 1

tables:

  # ── geography master ───────────────────────────────────────────────────────
  # The spine every view hangs off. Fully populated, zero nulls (§2). Codes stay
  # VARCHAR: they are LGD identifiers, not quantities.
  gram_panchayat:
    file: gram_panchayat.csv
    expected_rows: 20

  # ── planning core ──────────────────────────────────────────────────────────
  plan:
    file: plan.csv
    expected_rows: 204
    casts:
      approval_date: date

  planned_activity:
    file: planned_activity.csv
    expected_rows: 12704
    casts:
      total_cost: float           # PLANNED basis; null <=> costless activity

  # ── money layers ───────────────────────────────────────────────────────────
  # 12,730 rows, not 12,704: six activity_codes carry duplicate rows and twenty
  # codes have no planned_activity parent (§8). Both are handled downstream by
  # the stg_exp_rollup GROUP BY, never by dropping rows here.
  activity_expenditure:
    file: activity_expenditure.csv
    expected_rows: 12730
    casts:
      approved_cost_action_plan: float
      technical_approved_cost: float
      admin_approved_cost: float
      general: float
      sc: float
      st: float
      total_expenditure: float    # SPENT basis; == linked voucher sums exactly

  activity_voucher:
    file: activity_voucher.csv
    expected_rows: 5976
    casts:
      voucher_cost: float
      voucher_date: date

  voucher:
    file: voucher.csv
    expected_rows: 12440
    casts:
      amount: float               # CASHBOOK basis; direction gives the sign
      date: date

  # ── approvals ──────────────────────────────────────────────────────────────
  # plan_year stays VARCHAR: v_approval builds the 'YYYY-YYYY' fiscal year by
  # string concatenation off it, and that expression is re-expressed verbatim.
  admin_approval:
    file: admin_approval.csv
    expected_rows: 2101
    casts:
      work_proposed_cost: float
      adm_approval_sanction_date: date

  admin_approval_scheme:
    file: admin_approval_scheme.csv
    expected_rows: 2107          # 2,101 approvals + 6 second scheme rows
    casts:
      fund_sanctioned_general: float
      fund_sanctioned_sc: float
      fund_sanctioned_st: float
      fund_sanctioned_total: float

  technical_approval:
    file: technical_approval.csv
    expected_rows: 2134
    casts:
      tec_approval_cost: float
      tec_approval_order_date: date

  # ── activity 1:1 child tables (12,704 rows each, one per activity) ─────────
  activity_fund:
    file: activity_fund.csv
    expected_rows: 12704
    casts:
      fund_tied_general: float
      fund_tied_sc: float
      fund_tied_st: float
      fund_untied_general: float
      fund_untied_sc: float
      fund_untied_st: float
      fund_amount_total: float
      fund_tied_abandoned_general: float
      fund_tied_abandoned_sc: float
      fund_tied_abandoned_st: float
      fund_untied_abandoned_general: float
      fund_untied_abandoned_sc: float
      fund_untied_abandoned_st: float

  activity_asset:
    file: activity_asset.csv
    expected_rows: 12704
    casts:
      asset_unit_cost: float          # meas (candidate, 30% populated) — §7
      asset_unit_count: float         # staged, too sparse for v1 — §7
      main_asset_unit_count: float    # staged, too sparse for v1 — §7
      asset_loc_unit_count: float     # staged, too sparse for v1 — §7
      asset_loc_unit_cost_total: float  # staged, all null on this drop — §7

  activity_training:
    file: activity_training.csv
    expected_rows: 12704
    casts:
      training_trainees_total: int
      training_duration_days: int

  activity_community_service:
    file: activity_community_service.csv
    expected_rows: 12704
    casts:
      community_service_duration: int
      community_beneficiaries_expected: int

  # Staged and unused: every analytical column is null (is_delegated fully null,
  # is_shareable constant False). Registering it is a crosswalk-visible fact —
  # "this table exists and feeds nothing" — not an oversight.
  activity_delegation:
    file: activity_delegation.csv
    expected_rows: 12704

  # Zero rows. This is the evidence for "no equity view in v1" (§4.4), so the
  # table is staged rather than dropped. `expected_rows` is deliberately omitted:
  # the runner skips a falsy expected_rows (and 0 would be a divide-by-zero in
  # the tolerance arithmetic), so the zero-row fact is asserted in crosswalk.csv
  # and in the WP-D1 report instead of here.
  activity_nsap:
    file: activity_nsap.csv

  # ── evidence ───────────────────────────────────────────────────────────────
  # longitude_raw / latitude_raw stay VARCHAR: they hold comma-joined coordinate
  # LISTS ('83.7815807,83.7815986'), not scalars, and would fail a float cast.
  physical_progress:
    file: physical_progress.csv
    expected_rows: 8267
    casts:
      longitude: float
      latitude: float
      n_coords: int

  # ── dimension / decode tables ──────────────────────────────────────────────
  dim_code:
    file: dim_code.csv
    expected_rows: 717

  dim_lsdg_theme:
    file: dim_lsdg_theme.csv
    expected_rows: 17
    casts:
      distinct_themes: int
      n_rows: int

  dim_welfare_scheme:
    file: dim_welfare_scheme.csv
    expected_rows: 12

  # ── GP profile (WP-D11 / mapping doc Amendment B §12) ──────────────────────
  # One row per Gram Panchayat, 99 columns, self-reported. Joins the master 1:1
  # on basic_info_lgd = gram_panchayat.gp_lgd_code (zero orphans either side,
  # verified WP-D11). Source of the seven derived dimensions §12.3 puts on every
  # view, and of view4's profile measure family.
  #
  # THE 'NA' TRAP (WP-D11 T1). 379 cells in this CSV hold the literal string
  # 'NA', not an empty field, and the runner reads every file with
  # all_varchar=true — so DuckDB hands back the four characters, never a NULL.
  # `_cast` in build_views.py emits a plain CAST, which raises on 'NA' and would
  # fail registration outright. Seven numeric columns are affected and are
  # therefore NOT cast here; they are cast in derived_columns.sql behind
  # NULLIF(col, 'NA') so that a 'Not reported' band can only ever come from a
  # NULL and the string 'NA' reaches no view:
  #
  #     basic_amenities_no_of_{computer,laptop,printer,scanner}   2 'NA' each
  #     panchayat_learning_centre_details_{number_of_computers_laptops,
  #                                        seating_capacity,
  #                                        year_of_establishment}  18 'NA' each
  #
  # The remaining 43 counts carry no 'NA' on this drop and are cast here as
  # usual. If a statewide drop puts 'NA' in any of them, registration fails
  # loudly rather than silently — which is the right failure, and the WP-D11
  # report proposes a `try_int` cast type for the runner as the general fix.
  #
  # basic_info_lgd stays VARCHAR (the join key is an LGD identifier, not a
  # quantity — the same rule gram_panchayat.gp_lgd_code follows); it is cast to
  # VARCHAR explicitly in stg_gp_profile so the join is VARCHAR-to-VARCHAR.
  # panchayat_area_total_area is float even though it is X-unreliable (§12.6.10,
  # values 1.11 to 3,000 with no consistent unit): the cast records what the
  # column claims to be, and no band is built on it.
  gp_profile:
    file: gp_profile.csv
    expected_rows: 20
    casts:
      # distance, in km, to the nearest bus stop — the remoteness cut point
      basic_info_distance_from_nearest_bus_stop: int
      # demographics: male+female = total and general+obc+sc+st = total on all
      # 20 rows (§12.1). transgender is constant 0 (X-const) but still a count.
      demographic_details_total_gender_wise_population: int
      demographic_details_male_population: int
      demographic_details_female_population: int
      demographic_details_transgender_population: int
      demographic_details_children_population: int
      demographic_details_general_population: int
      demographic_details_obc_population: int
      demographic_details_sc_population: int
      demographic_details_st_population: int
      # education
      education_total_pre_primary_schools: int
      education_total_primary_schools: int
      education_total_secondary_schools: int
      education_total_higher_secondary_schools: int
      # general
      general_no_of_anganwadi_centers: int
      general_no_of_destitue_homes_old_age_homes: int
      general_no_of_households: int
      general_no_of_job_card_holders: int
      general_no_of_shg: int
      # health
      health_no_of_health_sub_centers: int
      health_no_of_primary_health_centers: int
      health_no_of_well_being_centers: int
      health_no_of_dispensary: int
      health_no_of_ayurvedic_clinics: int
      # infrastructure
      infrastructure_no_of_drinking_water_sources: int
      infrastructure_no_of_households_connected_to_tap_water: int
      infrastructure_no_of_household_toilets: int
      infrastructure_no_of_community_sanitary_complexes: int
      infrastructure_no_of_solid_waste_managements_centers: int
      infrastructure_no_of_common_service_centers: int
      infrastructure_no_of_banks_cooperative_banks: int
      infrastructure_no_of_atms: int
      infrastructure_no_of_rural_library: int
      infrastructure_no_of_children_parks: int
      infrastructure_no_of_disaster_rescue_centers: int
      infrastructure_no_of_bus_stands_with_drinking_water_facility: int
      infrastructure_no_of_cooperative_seed_centers: int
      # panchayat area
      panchayat_area_no_of_wards_sansads_of_the_panchayat: int
      panchayat_area_no_of_revenue_villages: int
      panchayat_area_no_of_villages_mapped_with_lgd: int
      # sports
      sports_no_of_badminton_court: int
      sports_no_of_football_court: int
      sports_no_of_volleyball_court: int
      # money and area
      basic_amenities_osr_collected_so_far: float
      panchayat_area_total_area: float
